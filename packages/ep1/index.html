<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episode 1: The Thirteenth Turning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0812;
      cursor: none;
    }
    canvas { display: block; }
    #custom-cursor {
      position: fixed;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="custom-cursor"></div>
  <script type="module" src="/src/App.js"></script>
</body>
</html>
